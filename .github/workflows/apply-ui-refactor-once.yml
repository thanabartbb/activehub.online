name: Apply Activity Hub UI Refactor Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ui-refactor-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace index.html with approved technical-console refactor
        shell: bash
        run: |
          cat > /tmp/index.html.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/index.html.gz.b64 | gunzip > index.html
          rm .github/workflows/apply-ui-refactor-once.yml

      - name: Commit refactor and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Activity Hub UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-ui-refactor-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: align Activity Hub with LSUPERAGENT docs"
          git push